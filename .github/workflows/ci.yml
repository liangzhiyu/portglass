name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests and packaging
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PortGlass-macOS-arm64
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.zip
            build/darwin-arm64/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PortGlass-macOS-arm64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; retaining its verified assets."
          else
            gh release create "$TAG" artifacts/* --title "PortGlass $TAG" --generate-notes
          fi
